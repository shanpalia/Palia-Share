name: palia_share
description: Fast, simple and secure local file sharing for Android by Shanpalia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  http: ^1.2.2
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/palia_share_logo.svg
