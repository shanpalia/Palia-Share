name: Build Palia Share

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=palia_share --org=com.shanpalia /tmp/palia_android
          cp -R /tmp/palia_android/android .

      - name: Configure Android 17 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Flutter 3.44 may generate either Gradle Groovy or Kotlin DSL files.
          for name in ('android/settings.gradle', 'android/settings.gradle.kts'):
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  import re
                  s = re.sub(r'(com\.android\.application[^\n:]*:)[0-9]+\.[0-9]+\.[0-9]+', r'\g<1>9.1.1', s)
                  s = re.sub(r'(com\.android\.application[^\n]*version\s*=\s*["\'])[0-9]+\.[0-9]+\.[0-9]+', r'\g<1>9.1.1', s)
                  p.write_text(s)
          for name in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              p = Path(name)
              if p.exists():
                  s = p.read_text()
                  s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
                  s = s.replace('compileSdk flutter.compileSdkVersion', 'compileSdk 37')
                  s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 37')
                  s = s.replace('targetSdk flutter.targetSdkVersion', 'targetSdk 37')
                  p.write_text(s)
          p = Path('android/gradle/wrapper/gradle-wrapper.properties')
          s = p.read_text()
          import re
          s = re.sub(r'gradle-[0-9.]+-(?:all|bin)\.zip', lambda m: 'gradle-9.3.1-' + ('all.zip' if 'all' in m.group(0) else 'bin.zip'), s)
          p.write_text(s)
          p = Path('android/gradle.properties')
          s = p.read_text()
          if 'android.builtInKotlin=' not in s: s += '\nandroid.builtInKotlin=false\n'
          if 'android.newDsl=' not in s: s += 'android.newDsl=false\n'
          p.write_text(s)
          PY

      - name: Apply Palia Share icon and Share Sheet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          convert assets/palia_share_logo.svg -background none -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert assets/palia_share_logo.svg -background none -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert assets/palia_share_logo.svg -background none -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert assets/palia_share_logo.svg -background none -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert assets/palia_share_logo.svg -background none -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp android/app/src/main/res/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png; done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
          s = s.replace('android:label="palia_share"', 'android:label="Palia Share"')
          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />\n</manifest>')
          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          if 'android:launchMode="singleTask"' not in s:
              s = s.replace('android:launchMode="singleTop"', 'android:launchMode="singleTask"')
          if 'android.intent.action.SEND_MULTIPLE' not in s:
              filters = '''\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="*/*" />\n            </intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.SEND_MULTIPLE" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="*/*" />\n            </intent-filter>'''
              s = s.replace('</activity>', filters + '\n        </activity>', 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Align Android JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
                  s = s.replace('android {', 'android {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }', 1)
              p.write_text(s)
          root = Path('/home/runner/.pub-cache/hosted/pub.dev')
          for p in root.glob('*/android/*'):
              if p.is_file() and p.suffix in {'.gradle', '.kts'}:
                  s = p.read_text().replace('JavaVersion.VERSION_11', 'JavaVersion.VERSION_17').replace("jvmTarget = '11'", "jvmTarget = '17'").replace('jvmTarget = "11"', 'jvmTarget = "17"')
                  p.write_text(s)
          PY

      - name: Remove stale default Flutter test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
