name: Build Palia Share

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=palia_share --org=com.shanpalia /tmp/palia_android
          cp -R /tmp/palia_android/android .
      - name: Configure Android SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
      - name: Apply Palia Share Android icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          magick assets/palia_share_logo.svg -background none -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          magick assets/palia_share_logo.svg -background none -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          magick assets/palia_share_logo.svg -background none -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          magick assets/palia_share_logo.svg -background none -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          magick assets/palia_share_logo.svg -background none -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"')
          p.write_text(s)
          PY
      - name: Configure Android local network access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />'''
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n' + permissions, s, count=1)
          else:
              missing = []
              for line in permissions.splitlines():
                  if line.strip() and line.strip() not in s:
                      missing.append(line)
              if missing:
                  s = s.replace('\n    <application', '\n' + '\n'.join(missing) + '\n    <application', 1)
          s = s.replace('<application ', '<application android:usesCleartextTraffic="true" ', 1)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force plugin compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/home/runner/.pub-cache/hosted/pub.dev')
          for p in root.glob('*/android/*'):
              if p.is_file() and p.suffix in {'.gradle', '.kts'}:
                  s = p.read_text()
                  s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36').replace('compileSdk = 34', 'compileSdk = 36').replace('compileSdk 34', 'compileSdk 36')
                  p.write_text(s)
          PY
      - name: Remove stale default Flutter test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows PC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        shell: pwsh
        run: flutter create --platforms=windows --project-name=palia_share --org=com.shanpalia .
      - name: Get dependencies
        shell: pwsh
        run: flutter pub get
      - name: Remove stale default Flutter test
        shell: pwsh
        run: if (Test-Path test\widget_test.dart) { Remove-Item test\widget_test.dart -Force }
      - name: Analyze
        shell: pwsh
        run: flutter analyze
      - name: Configure MSVC compatibility
        shell: pwsh
        run: |
          $env:CXXFLAGS = "$env:CXXFLAGS /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $env:CL = "$env:CL /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter clean
          flutter pub get
          flutter build windows --release
      - name: Apply Palia Share Windows icon
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          magick assets\palia_share_logo.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows\runner\resources\app_icon.ico
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Palia-Share-Windows-x64.zip -Force
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-windows-x64
          path: Palia-Share-Windows-x64.zip
