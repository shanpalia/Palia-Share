name: Build Palia Share APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=palia_share --org=com.shanpalia /tmp/palia_android
          cp -R /tmp/palia_android/android .
      - name: Configure Android SDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('android').rglob('*'):
              if p.is_file() and p.suffix in {'.gradle', '.kts'}:
                  s=p.read_text()
                  for old,new in {
                    'compileSdk = flutter.compileSdkVersion':'compileSdk = 36',
                    'compileSdk flutter.compileSdkVersion':'compileSdk 36',
                    'targetSdk = flutter.targetSdkVersion':'targetSdk = 36',
                    'targetSdk flutter.targetSdkVersion':'targetSdk 36'
                  }.items(): s=s.replace(old,new)
                  p.write_text(s)
          PY
      - name: Configure Android manifest permissions and Palia Share icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          s=s.replace(marker, permissions)
          s=s.replace('android:label="palia_share"','android:label="Palia Share"')
          import re
          if 'android:icon=' in s:
              s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_palia_share"', s, count=1)
          else:
              s=s.replace('<application ', '<application android:icon="@drawable/ic_palia_share" ', 1)
          p.write_text(s)

          icon=Path('android/app/src/main/res/drawable/ic_palia_share.xml')
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="512"\n    android:viewportHeight="512">\n    <path android:fillColor="#FFFFFFFF" android:pathData="M136,32 L376,32 C433.44,32 480,78.56 480,136 L480,376 C480,433.44 433.44,480 376,480 L136,480 C78.56,480 32,433.44 32,376 L32,136 C32,78.56 78.56,32 136,32 Z" />\n    <path android:fillColor="#263238" android:pathData="M160,145 C132,145 110,167 110,195 L110,317 C110,345 132,367 160,367 L208,367 L208,318 L180,318 C172,318 166,312 166,304 L166,208 C166,200 172,194 180,194 L208,194 L208,145 Z" />\n    <path android:fillColor="#263238" android:pathData="M352,145 L304,145 L304,194 L332,194 C340,194 346,200 346,208 L346,304 C346,312 340,318 332,318 L304,318 L304,367 L352,367 C380,367 402,345 402,317 L402,195 C402,167 380,145 352,145 Z" />\n    <path android:strokeColor="#18B78A" android:strokeWidth="24" android:strokeLineCap="round" android:strokeLineJoin="round" android:fillColor="@android:color/transparent" android:pathData="M186,256 L326,256 M291,206 L341,256 L291,306" />\n</vector>\n''')
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force Android compileSdk 36 for Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/runner/.pub-cache/hosted/pub.dev')
          changed=0
          for p in root.glob('*/android/*'):
              if p.is_file() and p.suffix in {'.gradle','.kts'}:
                  s=p.read_text(); original=s
                  for old,new in {
                    'compileSdk = flutter.compileSdkVersion':'compileSdk = 36',
                    'compileSdk flutter.compileSdkVersion':'compileSdk 36',
                    'compileSdk = 34':'compileSdk = 36',
                    'compileSdk 34':'compileSdk 36'
                  }.items(): s=s.replace(old,new)
                  if s!=original: p.write_text(s); changed+=1
          print(f'Updated {changed} plugin Gradle files to compileSdk 36')
          PY
      - name: Verify Android SDK
        run: |
          grep -R "compileSdk" android | head -20 || true
          ls -d "$ANDROID_HOME/platforms/android-"* | tail -10 || true
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
