name: Build Palia Share

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=palia_share --org=com.shanpalia /tmp/palia_android
          cp -R /tmp/palia_android/android .
      - name: Configure Android SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/g' android/app/build.gradle.kts
      - name: Add Android share-sheet support
        shell: bash
        run: |
          mkdir -p android/app/src/main/kotlin/com/shanpalia/palia_share
          cat > android/app/src/main/kotlin/com/shanpalia/palia_share/MainActivity.kt <<'KOTLIN'
          package com.shanpalia.palia_share

          import android.content.Intent
          import android.database.Cursor
          import android.net.Uri
          import android.provider.OpenableColumns
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileOutputStream

          class MainActivity : FlutterActivity() {
              private val channelName = "palia_share/share"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler { call, result ->
                      if (call.method == "getSharedFiles") {
                          result.success(copySharedFiles())
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              private fun copySharedFiles(): List<Map<String, Any>> {
                  val incoming = intent ?: return emptyList()
                  val uris = mutableListOf<Uri>()
                  when (incoming.action) {
                      Intent.ACTION_SEND -> {
                          incoming.getParcelableExtra<Uri>(Intent.EXTRA_STREAM)?.let { uris.add(it) }
                      }
                      Intent.ACTION_SEND_MULTIPLE -> {
                          incoming.getParcelableArrayListExtra<Uri>(Intent.EXTRA_STREAM)?.let { uris.addAll(it) }
                      }
                  }
                  if (uris.isEmpty()) return emptyList()

                  val dir = File(cacheDir, "shared_files")
                  dir.mkdirs()
                  val output = mutableListOf<Map<String, Any>>()
                  uris.forEachIndexed { index, uri ->
                      try {
                          val name = displayName(uri) ?: "shared_file_${index + 1}"
                          val safe = name.replace(Regex("[\\\\/:*?\\\"<>|]"), "_")
                          val target = File(dir, "${System.currentTimeMillis()}_$safe")
                          contentResolver.openInputStream(uri)?.use { input ->
                              FileOutputStream(target).use { out -> input.copyTo(out) }
                          } ?: return@forEachIndexed
                          output.add(mapOf("path" to target.absolutePath, "name" to name, "size" to target.length()))
                      } catch (_: Exception) {
                      }
                  }
                  return output
              }

              private fun displayName(uri: Uri): String? {
                  if (uri.scheme == "content") {
                      val cursor: Cursor? = contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                      cursor?.use {
                          if (it.moveToFirst()) return it.getString(0)
                      }
                  }
                  return uri.lastPathSegment?.substringAfterLast('/')
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          marker = '        </activity>'
          filters = '''            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="*/*" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND_MULTIPLE" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="*/*" />
            </intent-filter>
'''
          if 'android.intent.action.SEND_MULTIPLE' not in s:
              s = s.replace(marker, filters + marker, 1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/main.dart')
          s = p.read_text()
          if "package:flutter/services.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';", "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';")
          if 'palia_share/share' not in s:
              block = '''\nconst _shareChannel = MethodChannel('palia_share/share');\n\nFuture<List<PlatformFile>> getIncomingSharedFiles() async {\n  if (!Platform.isAndroid) return <PlatformFile>[];\n  try {\n    final raw = await _shareChannel.invokeMethod<List<dynamic>>('getSharedFiles') ?? <dynamic>[];\n    return raw.map((item) {\n      final map = Map<String, dynamic>.from(item as Map);\n      return PlatformFile(\n        name: '${map['name'] ?? 'shared_file'}',\n        path: '${map['path']}',\n        size: (map['size'] as num?)?.toInt() ?? 0,\n      );\n    }).toList();\n  } catch (_) {\n    return <PlatformFile>[];\n  }\n}\n'''
              s = s.replace("String appLanguage = 'English';", "String appLanguage = 'English';" + block)
          old = """      await requestAllPermissions();\n      if (!mounted) return;\n      Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeShell(onThemeChanged: widget.onThemeChanged, onLanguageChanged: widget.onLanguageChanged)));"""
          new = """      await requestAllPermissions();\n      final sharedFiles = await getIncomingSharedFiles();\n      if (!mounted) return;\n      Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => HomeShell(onThemeChanged: widget.onThemeChanged, onLanguageChanged: widget.onLanguageChanged, initialSharedFiles: sharedFiles)));"""
          s = s.replace(old, new)
          s = s.replace("""  final ValueChanged<String> onLanguageChanged;\n  const HomeShell({super.key, required this.onThemeChanged, required this.onLanguageChanged});""", """  final ValueChanged<String> onLanguageChanged;\n  final List<PlatformFile> initialSharedFiles;\n  const HomeShell({super.key, required this.onThemeChanged, required this.onLanguageChanged, this.initialSharedFiles = const []});""")
          old_state = """  int selected = 0;\n  final history = <String>[];\n  void addHistory(String value) => setState(() => history.insert(0, value));\n\n  @override\n  Widget build(BuildContext context) {"""
          new_state = """  int selected = 0;\n  final history = <String>[];\n  void addHistory(String value) => setState(() => history.insert(0, value));\n\n  @override\n  void initState() {\n    super.initState();\n    if (widget.initialSharedFiles.isNotEmpty) {\n      WidgetsBinding.instance.addPostFrameCallback((_) {\n        if (!mounted) return;\n        Navigator.push(context, MaterialPageRoute(builder: (_) => SendPage(files: widget.initialSharedFiles, onDone: addHistory)));\n      });\n    }\n  }\n\n  @override\n  Widget build(BuildContext context) {"""
          s = s.replace(old_state, new_state)
          p.write_text(s)
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force plugin compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/home/runner/.pub-cache/hosted/pub.dev')
          for p in root.glob('*/android/*'):
              if p.is_file() and p.suffix in {'.gradle', '.kts'}:
                  s = p.read_text()
                  s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36').replace('compileSdk flutter.compileSdkVersion', 'compileSdk 36').replace('compileSdk = 34', 'compileSdk = 36').replace('compileSdk 34', 'compileSdk 36')
                  p.write_text(s)
          PY
      - name: Remove stale default Flutter test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    name: Windows PC
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Generate Windows project
        shell: pwsh
        run: flutter create --platforms=windows --project-name=palia_share --org=com.shanpalia .
      - name: Get dependencies
        shell: pwsh
        run: flutter pub get
      - name: Remove stale default Flutter test
        shell: pwsh
        run: if (Test-Path test\widget_test.dart) { Remove-Item test\widget_test.dart -Force }
      - name: Analyze
        shell: pwsh
        run: flutter analyze
      - name: Configure MSVC compatibility
        shell: pwsh
        run: |
          $env:CXXFLAGS = "$env:CXXFLAGS /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          $env:CL = "$env:CL /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter clean
          flutter pub get
          flutter build windows --release
      - name: Apply Palia Share Windows icon
        shell: pwsh
        run: |
          choco install imagemagick --no-progress -y
          magick assets\palia_share_logo.svg -background none -define icon:auto-resize=256,128,64,48,32,16 windows\runner\resources\app_icon.ico
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Palia-Share-Windows-x64.zip -Force
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-windows-x64
          path: Palia-Share-Windows-x64.zip
