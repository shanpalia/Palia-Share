name: Build Palia Share APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android --project-name=palia_share --org=com.shanpalia /tmp/palia_android
          cp -R /tmp/palia_android/android .
      - name: Configure Android SDK versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('android').rglob('*'):
              if p.is_file() and p.suffix in {'.gradle', '.kts'}:
                  s=p.read_text()
                  for old,new in {
                    'compileSdk = flutter.compileSdkVersion':'compileSdk = 36',
                    'compileSdk flutter.compileSdkVersion':'compileSdk 36',
                    'targetSdk = flutter.targetSdkVersion':'targetSdk = 36',
                    'targetSdk flutter.targetSdkVersion':'targetSdk 36'
                  }.items(): s=s.replace(old,new)
                  p.write_text(s)
          PY
      - name: Configure Android manifest permissions and Palia Share icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          s=s.replace(marker, permissions)
          s=s.replace('android:label="palia_share"','android:label="Palia Share"')
          if 'android:icon=' in s:
              import re
              s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_palia_share"', s, count=1)
          else:
              s=s.replace('<application ', '<application android:icon="@drawable/ic_palia_share" ', 1)
          p.write_text(s)

          icon=Path('android/app/src/main/res/drawable/ic_palia_share.xml')
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<vector xmlns:android="http://schemas.android.com/apk/res/android"\n    android:width="108dp"\n    android:height="108dp"\n    android:viewportWidth="108"\n    android:viewportHeight="108">\n    <path android:fillColor="#18B78A" android:pathData="M54,4 C26.386,4 4,26.386 4,54 C4,81.614 26.386,104 54,104 C81.614,104 104,81.614 104,54 C104,26.386 81.614,4 54,4 Z" />\n    <path android:fillColor="#FFFFFFFF" android:pathData="M54,49 A7,7 0,1 0,54,63 A7,7 0,1 0,54,49 Z M25,67 A7,7 0,1 0,25,81 A7,7 0,1 0,25,67 Z M83,25 A7,7 0,1 0,83,39 A7,7 0,1 0,83,25 Z" />\n    <path android:strokeColor="#FFFFFFFF" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="@android:color/transparent" android:pathData="M31,69 L48,59 M60,52 L77,37" />\n</vector>\n''')
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Force Android compileSdk 36 for Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/home/runner/.pub-cache/hosted/pub.dev')
          changed=0
          for p in root.glob('*/android/*'):
              if p.is_file() and p.suffix in {'.gradle','.kts'}:
                  s=p.read_text(); original=s
                  for old,new in {
                    'compileSdk = flutter.compileSdkVersion':'compileSdk = 36',
                    'compileSdk flutter.compileSdkVersion':'compileSdk 36',
                    'compileSdk = 34':'compileSdk = 36',
                    'compileSdk 34':'compileSdk 36'
                  }.items(): s=s.replace(old,new)
                  if s!=original: p.write_text(s); changed+=1
          print(f'Updated {changed} plugin Gradle files to compileSdk 36')
          PY
      - name: Verify Android SDK
        run: |
          grep -R "compileSdk" android | head -20 || true
          ls -d "$ANDROID_HOME/platforms/android-"* | tail -10 || true
      - name: Analyze
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: palia-share-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
